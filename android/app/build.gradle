plugins { id 'com.android.application' }

android {
    namespace 'com.crtc.app'
    compileSdk 36

    signingConfigs {
        debug {
            storeFile file('../appraze-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId 'com.crtc.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.0-native'
        // Appraze POS backend (pos_connect.py). HTTPS only; empty = POS shows
        // "server not set up". Set with: gradle -PapprazePosApi=https://host
        buildConfigField 'String', 'POS_API_BASE', "\"${project.findProperty('apprazePosApi') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Stripe Terminal: Tap to Pay on Android (minSdk 26; Tap to Pay itself needs Android 11+).
    implementation 'com.stripe:stripeterminal-core:5.8.1'
    implementation 'com.stripe:stripeterminal-taptopay:5.8.1'
    testImplementation 'junit:junit:4.13.2'
}
