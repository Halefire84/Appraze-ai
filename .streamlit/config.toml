# Serves files placed in ./static/ at <app-url>/app/static/<filename> -
# needed for the PWA manifest.json and its icons (installable desktop app,
# see manifest.json + the head-injection snippet near the top of app.py).
[server]
enableStaticServing = true

[client]
# Hides Streamlit's own "Deploy" button and most of the hamburger menu
# (Streamlit Cloud settings, "Report a bug", "About Streamlit", etc.) --
# that chrome is what makes any Streamlit app read as "someone's internal
# dev tool" instead of a finished program. "minimal" keeps only what an
# end user actually needs (Rerun/Settings), not Streamlit's own branding.
# Belt-and-suspenders alongside ui_theme.py's own CSS chrome-hiding rule.
toolbarMode = "minimal"

# Without this section, Streamlit's native widgets (text inputs, selects,
# sliders, etc.) follow the visitor's OS/browser dark-mode preference,
# while app.py's LIGHT_CSS sets .stApp's text color dark for the app's own
# light design -- on a phone/browser in system dark mode, that combination
# puts dark text on Streamlit's dark-mode input background, effectively
# unreadable. Pinning the theme here fixes every native widget at once,
# not just text inputs. Palette matches the Appraze brand (see
# APPRAZE_BRAND.md / static/appraze-mark.svg) instead of Streamlit's
# default blue/red accents -- native widgets (buttons, sliders,
# checkboxes, the sidebar) now look like part of one designed product
# instead of stock Streamlit.
[theme]
base = "light"
primaryColor = "#f5a524"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fc"
textColor = "#172230"
font = "sans serif"
