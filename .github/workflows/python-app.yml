# CRTC quality gate: every push/PR is compile-checked, linted for blocking
# Python errors, and tested. Scheduled scanning/alerting should use a separate
# workflow so a source outage never blocks the main application build.
name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-webhook.txt ]; then pip install -r requirements-webhook.txt; fi
      - name: Compile-check every Python file
        run: python -m compileall -q .
      - name: Blocking lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest
        run: pytest -v
