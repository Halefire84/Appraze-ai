name: CRTC Android TWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-twa.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release AAB
        if: ${{ secrets.RELEASE_STORE_FILE_B64 != '' }}
        env:
          RELEASE_STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_STORE_FILE_B64" | base64 --decode > release.keystore
          gradle :app:bundleRelease -PRELEASE_STORE_FILE="$PWD/release.keystore"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crtc-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release AAB
        if: ${{ secrets.RELEASE_STORE_FILE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: crtc-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
